services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./smart_home/init.sql:/docker-entrypoint-initdb.d/01-legacy.sql:ro
      - ./init-mvp.sql:/docker-entrypoint-initdb.d/02-mvp.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smarthome"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [smarthome-network]

  temperature-api:
    build:
      context: .
      dockerfile: temperature_api/Dockerfile
    ports: ["8081:8081"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [smarthome-network]

  devices-service:
    build:
      context: .
      dockerfile: devices_service/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/smarthome
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["8082:8082"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8082/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [smarthome-network]

  telemetry-service:
    build:
      context: .
      dockerfile: telemetry_service/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/smarthome
      DEVICES_API_URL: http://devices-service:8082
      TEMPERATURE_API_URL: http://temperature-api:8081
      POLL_INTERVAL_SECONDS: "5"
    depends_on:
      postgres:
        condition: service_healthy
      devices-service:
        condition: service_healthy
      temperature-api:
        condition: service_healthy
    ports: ["8083:8083"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8083/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [smarthome-network]

  app:
    build: ./smart_home
    depends_on:
      postgres:
        condition: service_healthy
      telemetry-service:
        condition: service_healthy
      devices-service:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/smarthome
      DEVICES_API_URL: http://devices-service:8082
      TEMPERATURE_API_URL: http://telemetry-service:8083
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [smarthome-network]

volumes:
  postgres_data:

networks:
  smarthome-network:
    driver: bridge
