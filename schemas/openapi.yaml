openapi: 3.0.3
info:
  title: Тёплый дом — пять основных операций API
  version: 1.0.0
  description: >-
    Выбранные контракты целевой системы: сведения об устройстве, обновление
    снимка состояния, доставка команды, приём и чтение телеметрии.
    HTTPS и JWT относятся к To-Be. В MVP используются HTTP и демонстрационный дом;
    отправка команд физическому оборудованию не реализована. Полный фактический
    API MVP доступен в schemas/mvp и Swagger каждого работающего сервиса.
servers:
  - url: https://devices.warmhouse.example
    description: Сервис устройств (To-Be)
security:
  - bearerAuth: []
tags:
  - {name: Devices, description: 'Реестр, снимок состояния и доставка команд'}
  - {name: Telemetry, description: Приём и история измерений}
paths:
  /api/v1/devices/{device_id}:
    parameters: [{$ref: '#/components/parameters/DeviceId'}]
    get:
      tags: [Devices]
      operationId: getDevice
      summary: Получить сведения об устройстве
      description: Проверяется доступ к дому устройства. Тип и производитель берутся из DeviceType, возможности — из реестра.
      responses:
        '200':
          description: Устройство найдено
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Device'}
              examples:
                temperatureSensor:
                  value:
                    id: 1
                    home_id: 1
                    type_id: 1
                    module_id: 1
                    name: Kitchen sensor
                    type: temperature
                    serial_number: TMP-001
                    location: Kitchen
                    protocol: https
                    capabilities: [read_temperature]
                    status: active
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/devices/{device_id}/value:
    parameters: [{$ref: '#/components/parameters/DeviceId'}]
    patch:
      tags: [Devices]
      operationId: updateDeviceState
      summary: Обновить сохранённый снимок состояния
      description: >-
        Записывает значение и статус в реестр. Это не команда оборудованию.
        В To-Be вызывается доверенным адаптером с правом обновления состояния;
        value может быть нулевым. Время обновления выставляет сервер.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ValueUpdate'}
            examples:
              zeroTemperature:
                value: {value: 0, status: active}
      responses:
        '200':
          description: Снимок обновлён
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: {type: string}
              examples:
                updated:
                  value: {message: Sensor value updated successfully}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/InvalidInput'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/devices/{device_id}/commands:
    parameters:
      - name: device_id
        in: path
        required: true
        schema: {type: integer, format: int64, minimum: 1}
        examples:
          heatingModule: {value: 2}
    post:
      tags: [Devices]
      operationId: dispatchCommand
      summary: Передать команду протокольному адаптеру (To-Be)
      description: >-
        Вызывается сервисом отопления, света или ворот. Проверяются права и
        возможности устройства. 202 означает приём, а не выполнение.
        Подтверждение передаётся событием device.state.changed.
        Повтор с тем же command_id и телом не создаёт вторую команду;
        другое тело при том же command_id даёт 409. В MVP этот маршрут отсутствует.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CommandRequest'}
            examples:
              turnOnHeating:
                value:
                  command_id: 15d19abb-523b-4398-9785-78f8700e6de1
                  operation: turn_on
                  parameters: {}
      responses:
        '202':
          description: Команда принята к доставке
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommandAccepted'}
              examples:
                accepted:
                  value:
                    command_id: 15d19abb-523b-4398-9785-78f8700e6de1
                    device_id: 2
                    status: accepted
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Идентификатор команды уже использован с другим телом
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              examples:
                conflict:
                  value: {detail: Command ID already used}
        '422': {$ref: '#/components/responses/InvalidInput'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/measurements:
    servers:
      - {url: 'https://telemetry.warmhouse.example', description: Сервис телеметрии (To-Be)}
    post:
      tags: [Telemetry]
      operationId: ingestMeasurement
      summary: Принять измерение
      description: >-
        Вызывается адаптером устройств. Проверяются устройство и дом.
        Повтор UUID не создаёт дубль; при повторе возвращается сохранённое измерение.
        timestamp с часовым поясом соответствует observed_at в хранилище.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Measurement'}
            examples:
              temperature:
                value:
                  id: e1a0616f-e69a-40fb-b352-6afdb4b46e81
                  device_id: 1
                  home_id: 1
                  sensor_id: '1'
                  sensor_type: temperature
                  location: Kitchen
                  value: 22.5
                  unit: '°C'
                  status: active
                  timestamp: '2026-11-01T10:00:00Z'
      responses:
        '201':
          description: Измерение сохранено или уже существовало
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Measurement'}
              examples:
                saved:
                  value:
                    id: e1a0616f-e69a-40fb-b352-6afdb4b46e81
                    device_id: 1
                    home_id: 1
                    sensor_id: '1'
                    sensor_type: temperature
                    location: Kitchen
                    value: 22.5
                    unit: '°C'
                    status: active
                    timestamp: '2026-11-01T10:00:00Z'
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/InvalidInput'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
    get:
      tags: [Telemetry]
      operationId: getMeasurements
      summary: Получить историю показаний
      description: Читает только БД, без запроса к устройству. Пустая история возвращается как 200 и [].
      parameters:
        - name: device_id
          in: query
          required: true
          schema: {type: integer, format: int64, minimum: 1}
          examples:
            kitchenSensor: {value: 1}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 1000, default: 100}
          examples:
            lastTen: {value: 10}
      responses:
        '200':
          description: Показания от новых к старым
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Measurement'}
              examples:
                history:
                  value:
                    - id: e1a0616f-e69a-40fb-b352-6afdb4b46e81
                      device_id: 1
                      home_id: 1
                      sensor_id: '1'
                      sensor_type: temperature
                      location: Kitchen
                      value: 22.5
                      unit: '°C'
                      status: active
                      timestamp: '2026-11-01T10:00:00Z'
                empty: {value: []}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/InvalidInput'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    DeviceId:
      name: device_id
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
      examples:
        device: {value: 1}
  schemas:
    Device:
      type: object
      required: [id, home_id, type_id, name, type, serial_number, protocol, capabilities, status]
      properties:
        id: {type: integer, format: int64}
        home_id: {type: integer, format: int64}
        type_id: {type: integer, format: int64}
        module_id: {type: integer, format: int64, nullable: true}
        name: {type: string}
        type: {type: string, description: 'Код DeviceType, не закрытое перечисление.'}
        serial_number: {type: string}
        location: {type: string}
        protocol: {type: string}
        capabilities: {type: array, items: {type: string}}
        status: {type: string}
    ValueUpdate:
      type: object
      required: [value, status]
      properties:
        value: {type: number, format: double}
        status: {type: string, minLength: 1, maxLength: 20}
    CommandRequest:
      type: object
      required: [command_id, operation]
      properties:
        command_id: {type: string, format: uuid}
        operation: {type: string, minLength: 1, description: 'Например turn_on, turn_off, open, close; проверяется по capabilities.'}
        parameters: {type: object, additionalProperties: true}
    CommandAccepted:
      type: object
      required: [command_id, device_id, status]
      properties:
        command_id: {type: string, format: uuid}
        device_id: {type: integer, format: int64}
        status: {type: string, enum: [accepted]}
    Measurement:
      type: object
      required: [id, device_id, home_id, sensor_id, sensor_type, location, value, unit, status, timestamp]
      properties:
        id: {type: string, format: uuid}
        device_id: {type: integer, format: int64, minimum: 1}
        home_id: {type: integer, format: int64, minimum: 1}
        sensor_id: {type: string}
        sensor_type: {type: string}
        location: {type: string}
        value: {type: number, format: double}
        unit: {type: string}
        status: {type: string}
        timestamp: {type: string, format: date-time}
    Error:
      type: object
      required: [detail]
      properties:
        detail:
          oneOf:
            - {type: string}
            - {type: array, items: {type: object}}
  responses:
    Unauthenticated:
      description: Требуется действительный JWT (To-Be)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          examples:
            missingToken: {value: {detail: Authentication required}}
    Forbidden:
      description: Нет права на дом или операцию (To-Be)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          examples:
            forbidden: {value: {detail: Access denied}}
    NotFound:
      description: Устройство отсутствует
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          examples:
            missingDevice: {value: {detail: Device not found}}
    InvalidInput:
      description: Неверное тело, параметры, принадлежность дому или неподдерживаемая операция
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          examples:
            wrongHome: {value: {detail: Device does not belong to this home}}
    InternalError:
      description: Непредвиденная ошибка сервера
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          examples:
            internal: {value: {detail: Internal server error}}
    Unavailable:
      description: Хранилище или зависимый сервис недоступен
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          examples:
            unavailable: {value: {detail: Storage unavailable}}
